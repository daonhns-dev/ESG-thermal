# EfficientAD — 논문/공식(rximg/EfficientAD) 스펙
#
# 파이프라인:
#   1) (선택) distill_pdn.py 또는 공식 가중치 다운로드 → teacher_distilled.pth
#   2) train_efficientad.py → Algorithm 1 학습
#   3) inference_efficientad.py → Algorithm 2 추론
#
# Loss (논문 원문 그대로, 가중치 없음):
#   L_ST    = L_hard + pretraining_penalty
#   L_total = L_ST + L_AE + L_STAE

# -----------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------
model:
  variant: "M"                    # S | M  (Table 6 / Table 7)
  input_size: 256                 # PDN 출력 64×64, 입력은 반드시 256×256
  in_channels: 3                  # 모델 입력 채널. channel_mode와 연동.
  teacher_out_channels: 384
  student_out_channels: 768       # 앞 384: Y_ST(local), 뒤 384: Y_STAE(global)
  with_bn: false                  # 공식 기본 false
  # 1ch/3ch 처리 방식:
  #   "gray2rgb" → grayscale을 3채널로 복제 (in_channels=3, ImageNet 사전학습 활용)
  #   "gray"     → 1채널 그대로 사용 (in_channels=1, 증류부터 1ch로 재학습 필요)
  channel_mode: "gray2rgb"

# -----------------------------------------------------------------------
# Distillation — Algorithm 3
# -----------------------------------------------------------------------
distillation:
  backbone: "wide_resnet101_2"
  iterations: 60000               # iteration 단위
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  # gray_prob:
  #   논문(ImageNet 증류): 0.1  — RGB 자연 이미지 중 10%만 grayscale 변환
  #   열화상 증류:         0.5  — 열화상은 이미 grayscale이므로 비율 의미 희박, 다양성 확보용
  gray_prob: 0.5
  # 열화상 도메인 적응 증류 산출물 (원본 ImageNet 증류본과 구분)
  # 증류 완료 후 training.teacher_checkpoint를 이 경로로 변경 + teacher_feat_norm.pt 삭제
  save_path: "results/checkpoints/efficientad/teacher_distilled_thermal.pth"

# -----------------------------------------------------------------------
# Training — Algorithm 1
# -----------------------------------------------------------------------
training:
  # 논문 스케일 본 학습 (파이프라인만 확인할 때는 작은 값으로 줄이면 됨)
  iterations: 70000
  batch_size: 1                   # 논문 Algorithm 1
  p_hard: 0.999
  lr: 0.0001
  lr_decay_after: 66500           # iteration 66500 이후 lr → lr_decay_value
  lr_decay_value: 0.00001
  weight_decay: 0.00001
  num_workers: 4
  save_dir: "results/checkpoints/efficientad_plant_M"
  tensorboard_dir: "results/tensorboard/efficientad"
  viz_dir: "results/visualizations/efficientad"

  # Teacher 가중치: 공식 다운로드 or distill_pdn.py 산출물
  # [실험 결과] 열화상 재증류(thermal)는 ImageNet 증류보다 성능이 낮았음 (Local AUC 0.58)
  # 원인: 22k 이미지의 낮은 다양성 + 랜덤 projection으로 Teacher 특징이 단순해져 판별력 소멸
  teacher_checkpoint: "EfficientAD/ckptMedium/best_teacher.pth"          # ← 원본 (ImageNet 증류) ✅ 사용
  # teacher_checkpoint: "results/checkpoints/efficientad/teacher_distilled_thermal.pth"  # ← 열화상 재증류 (실험용, AUC 0.74)
  # Teacher 채널 통계 캐시 (없으면 학습 시작 시 자동 계산)
  teacher_norm_cache: "results/checkpoints/efficientad_plant_M/teacher_feat_norm_M.pt"
  teacher_stats_batch_size: 8

  # AE augmentation (Algorithm 1, lines 23-27)
  # brightness / contrast / saturation 중 랜덤 1개, λ ~ U(0.8, 1.2)
  augmentation:
    brightness_range: [0.8, 1.2]
    contrast_range: [0.8, 1.2]
    saturation_range: [0.8, 1.2]

# -----------------------------------------------------------------------
# Map normalization — Section 3.4
# -----------------------------------------------------------------------
normalization:
  q_a: 0.95                        # Table 3 기본값
  q_b: 0.99                        # Table 3 기본값
  # quantile map normalization 계산 시간을 줄이기 위한 초소형 val 분할
  val_ratio: 0.1                  # train normal 중 validation 비율
  quantile_split_seed: 42

# -----------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------
data:
  train_dir: "data/plant/train"          # data/train/normal/ 하위 이미지
  test_dir: "data/plant/test"            # data/test/normal/, data/test/anomaly/
  imagenet_path: "data/Tiny-imagenet-200"
  imagenet_gray_prob: 0.3          # pretraining penalty 시 grayscale 확률
  image_size: 256
  train_fraction: 1.0
  test_fraction: 1.0

# -----------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------
evaluation:
  threshold: "auto"
  metrics: ["AUC", "F1", "Precision", "Recall", "Accuracy"]
  visualize:
    # 파이프라인 체크용: heatmap 저장 개수를 줄입니다.
    num_samples: 20
    save_dir: "results/visualizations/efficientad_plant_M"

# -----------------------------------------------------------------------
# Inference
# -----------------------------------------------------------------------
inference:
  checkpoint: "results/checkpoints/efficientad_plant_M/efficientad.pth"
  output_dir: "results/predictions"
  save_heatmap: true
  heatmap_dir: "results/predictions/efficientad_plant_heatmaps_M"
  use_fp16: false
  # -----------------------------------------------------------------------
  # 스코어 집계 파라미터 (실험으로 결정된 최적값, 재학습 불필요)
  #   score_alpha:      local(S-T) 브랜치 가중치. combined = alpha*local + (1-alpha)*global
  #                     0.3 최적 — heatmap 진단으로 Local FP 원인 확인 후 결정
  #   score_agg:        max → topk_mean 변경으로 AUC +0.11, FP -50% 달성
  #   score_topk_ratio: 상위 15% 픽셀 평균 (M모델 최적값, AUC 0.9568 달성)
  #   score_threshold:  validation set 기반으로 결정된 운영 threshold
  #                     data/val (test의 20% 분리) 에서 F1 최대화 기준으로 산출
  #                     → AUC 0.9568 / Accuracy 0.9017 / FP 448 / FN 486
  # -----------------------------------------------------------------------
  score_alpha: 0.3
  score_agg: "topk_mean"
  score_topk_ratio: 0.15
  score_threshold: -0.001159

# -----------------------------------------------------------------------
# Hardware / Logging
# -----------------------------------------------------------------------
device: "cuda"
seed: 42

logging:
  use_tensorboard: true
  tensorboard_dir: "results/tensorboard/efficientad"
  log_interval: 500