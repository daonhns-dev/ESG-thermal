name: heatpipe-service

x-heatpipe-environment: &heatpipe-environment
  HEATPIPE_ENV: production
  HEATPIPE_API_TOKEN: ${HEATPIPE_API_TOKEN:?Set HEATPIPE_API_TOKEN in .env}
  HEATPIPE_JOB_DB_PATH: /data/jobs.sqlite3
  HEATPIPE_STORAGE: local
  HEATPIPE_STORAGE_ROOT: /data/objects
  HEATPIPE_WORK_ROOT: /data/work
  HEATPIPE_ANALYSIS_DEVICE: cpu
  HEATPIPE_ALLOWED_SOURCE_HOSTS: ${HEATPIPE_ALLOWED_SOURCE_HOSTS:-}
  HEATPIPE_ALLOWED_INTERNAL_HTTP_HOSTS: ${HEATPIPE_ALLOWED_INTERNAL_HTTP_HOSTS:-}

services:
  api:
    image: heatpipe-service:local
    build: .
    init: true
    environment: *heatpipe-environment
    ports:
      - "${HEATPIPE_BIND_HOST:-127.0.0.1}:${HEATPIPE_HTTP_PORT:-18001}:8000"
    volumes:
      - heatpipe_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    image: heatpipe-service:local
    init: true
    command: ["heatpipe-worker", "--poll-seconds", "2"]
    environment: *heatpipe-environment
    volumes:
      - heatpipe_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  heatpipe_data:
