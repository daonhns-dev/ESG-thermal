[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatpipe-service"
version = "0.1.0"
description = "DaonH&S district-heating thermal anomaly analysis service"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "jsonschema>=4.20", "httpx>=0.27,<1"]
minio = ["minio>=7.2,<8"]
pdf = ["reportlab>=4,<5"]
gpu = ["cupy-cuda13x[ctk]>=14,<15"]

[project.scripts]
heatpipe-batch = "heatpipe_service.jobs.batch:main"
heatpipe-worker = "heatpipe_service.jobs.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"heatpipe_service.api" = ["mock_result.json", "mock_image.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

